<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Workbench 界面原型</title>
<style>
:root{--blue:#3563e9;--ink:#182230;--muted:#667384;--line:#e3e7ed;--bg:#f5f6f8;--green:#18865e;--amber:#ac6d14}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #82baff;outline-offset:3px}button{border:0;background:none;color:inherit}button:disabled{cursor:default;opacity:.45}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.shell{min-height:100vh;display:grid;grid-template-columns:216px minmax(0,1fr)}.sidebar{background:#17212f;color:#adb8c8;padding:30px 18px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;color:white;font-size:19px;font-weight:650;letter-spacing:-.5px;margin:0 10px 35px}.logo{width:34px;height:34px;border-radius:10px;background:#4271f0;display:grid;place-items:center;font-size:19px;color:white}.workspace{border:1px solid #344151;background:#202e40;border-radius:8px;padding:13px 12px;margin-bottom:28px;color:white}.workspace small{display:block;color:#9caabd;margin-bottom:6px;font-size:11px}.workspace b{font-size:13px;font-weight:500}.navlabel{font-size:10px;letter-spacing:1.7px;margin:0 12px 11px;color:#79879a}.nav{display:flex;flex-direction:column;gap:6px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:7px;font-size:13px}.nav button:hover{background:#233145;color:white}.nav button.active{background:#315bcc;color:white}.count{margin-left:auto;border-radius:5px;background:#ffffff18;padding:1px 7px;font-size:11px}.sidefoot{margin-top:auto}.profile{margin-top:18px;border-top:1px solid #344151;padding:22px 8px 0;display:flex;align-items:center;gap:10px;color:white}.avatar{width:32px;height:32px;border-radius:50%;background:#d6dfef;color:#29435b;display:grid;place-items:center;font-size:12px;font-weight:600}.profile small{display:block;font-size:10px;color:#92a1b5;margin-top:4px}.body{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);padding:0 36px;display:flex;align-items:center;justify-content:space-between;gap:12px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:500}.bar-actions{display:flex;align-items:center;gap:16px}.search{padding:9px 12px;background:#f5f6f8;border:1px solid var(--line);border-radius:7px;color:var(--muted);display:flex;gap:8px;align-items:center}.search input{border:0;background:transparent;width:148px;outline:0;font-size:12px}.demo{font-size:10px;color:#697589;background:#edf1f6;border-radius:5px;padding:5px 8px}.btn{padding:10px 15px;border-radius:7px;border:1px solid var(--line);background:white;font-size:12px;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:#b54540}.main{padding:32px 36px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#77859a;margin-bottom:8px}h1{font-size:26px;letter-spacing:-.6px;font-weight:650;margin:0 0 8px}p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:27px}.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;justify-content:space-between;gap:10px}.stat label{font-size:12px;color:var(--muted);display:block;margin-bottom:12px}.stat b{font-size:30px;font-weight:600;letter-spacing:-1px}.stat small{font-size:10px;display:block;margin-top:7px;color:var(--muted)}.stat-icon{background:#eef2fe;color:var(--blue);width:33px;height:33px;border-radius:8px;display:grid;place-items:center}.grid{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}.panelhead{padding:20px 22px;display:flex;justify-content:space-between;align-items:center}.panelhead h2{font-size:14px;font-weight:600;margin:0}.link{font-size:11px;color:var(--blue)}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:#8190a1;background:#fafbfd;font-weight:500;font-size:10px;padding:12px 20px;border-bottom:1px solid var(--line)}td{padding:18px 20px;border-bottom:1px solid #edf0f4}tr:last-child td{border-bottom:0}.task-row{cursor:pointer}.task-row:hover{background:#fafbff}.task-title{font-size:12px;font-weight:500;display:block;margin-bottom:7px}.sub{font-size:10px;color:#8995a5}.badge{display:inline-flex;align-items:center;gap:5px;background:#eef2f8;color:#667384;padding:4px 8px;border-radius:5px;white-space:nowrap;font-size:10px}.badge:before{content:'';width:4px;height:4px;background:currentColor;border-radius:50%}.badge.running{background:#edf2ff;color:#3863d8}.badge.review{background:#fff6e4;color:#9d6b1e}.badge.done{background:#eaf7f0;color:#22845b}.badge.failed{background:#fdeceb;color:#b54742}.deptgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.dept{border:1px solid var(--line);border-radius:9px;background:white;padding:18px 20px;text-align:left}.dept:hover{border-color:#9cb5f4}.depttop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dept h3{font-size:12px;font-weight:600;margin:0}.dept p{font-size:11px}.dept small{display:block;color:#8592a3;font-size:10px;margin-top:15px}.flow{padding:0 22px 15px}.flowitem{padding:17px 0;display:grid;grid-template-columns:24px 1fr;gap:10px;border-top:1px solid #edf0f4}.flowdot{width:22px;height:22px;background:#edf2fe;color:var(--blue);border-radius:7px;display:grid;place-items:center;font-size:10px}.flowitem strong{font-size:11px;font-weight:500}.flowitem p{font-size:10px;margin-top:6px}.connection{margin-top:18px;background:#eaf0fb;border-radius:10px;padding:22px}.connection h3{font-size:12px;font-weight:600;margin:0 0 9px}.connection .btn{margin-top:14px;background:transparent;border-color:#c5d5f0;color:#335bc3}.toolbar{display:flex;gap:6px;margin-bottom:22px;align-items:center}.tab{padding:8px 13px;border-radius:6px;font-size:11px;color:var(--muted)}.tab.active{background:#e9efff;color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.employee{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}.employee-head{display:flex;gap:12px;align-items:center;margin-bottom:17px}.roleicon{width:42px;height:42px;border-radius:12px;background:#eef2fe;color:#4b6dd1;display:grid;place-items:center}.employee h3{font-size:14px;font-weight:600;margin:0 0 6px}.employee p{font-size:11px}.employee footer{border-top:1px solid #edf0f4;margin-top:20px;padding-top:14px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.tasklayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px}.detail{padding:23px}.detail h2{font-size:17px;line-height:1.6;margin:12px 0 19px}.detail dl{display:grid;grid-template-columns:76px 1fr;gap:13px;font-size:11px;margin:22px 0}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.detail-tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px}.detail-tabs button{padding:10px 9px;font-size:11px;color:var(--muted);border-bottom:2px solid transparent}.detail-tabs button.active{border-color:var(--blue);color:var(--blue)}pre{background:#192432;color:#c6d6eb;padding:18px;border-radius:7px;overflow:auto;font:11px/1.9 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.detail-actions{display:flex;gap:8px;margin-top:20px}.empty{padding:70px 24px;text-align:center}.empty h3{font-size:16px}.toolname{display:flex;gap:12px;align-items:center}.toolicon{background:#f0f3f8;color:#53637a;padding:9px;border-radius:9px}.toolname strong{font-size:12px;font-weight:500}.path{font:10px ui-monospace,monospace;color:#788598;overflow-wrap:anywhere}.filetype{width:31px;height:37px;border:1px solid #c9d5e9;background:#f0f4fc;color:#6080b2;display:grid;place-items:center;font-size:8px;border-radius:4px}.footnote{font-size:10px;color:#8793a3;margin-top:22px}.overlay{position:fixed;inset:0;background:#0c172568;display:grid;place-items:center;z-index:20;padding:20px}.overlay[hidden]{display:none}.modal{background:white;width:510px;max-width:100%;border-radius:13px;box-shadow:0 24px 90px #081d4633;padding:28px}.modal h2{font-size:20px;margin:0 0 7px}.formrow{margin-top:18px}.formrow label{display:block;font-size:12px;font-weight:500;margin-bottom:8px}.formrow input,.formrow select,.formrow textarea{width:100%;padding:10px 12px;border:1px solid #dbe2eb;border-radius:6px;background:#fff;font-size:12px;resize:vertical}.formrow small{display:block;color:var(--muted);font-size:10px;margin-top:6px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:25px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#172638;color:white;border-radius:8px;padding:12px 20px;font-size:12px;z-index:30}.toast[hidden]{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1200px){.main{padding:26px}.topbar{padding:0 26px}.grid{grid-template-columns:minmax(0,1fr) 260px}.tasklayout{grid-template-columns:minmax(0,1fr) 300px}td,th{padding-left:14px;padding-right:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.search{display:none}}@media(max-width:850px){.shell{grid-template-columns:170px minmax(0,1fr)}.sidebar{padding:24px 12px}.brand{font-size:15px;margin-left:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.tasklayout{grid-template-columns:1fr}.topbar{padding:0 18px}.main{padding:24px 18px}.bar-actions{gap:8px}.demo{display:none}.cards{grid-template-columns:1fr}.deptgrid{grid-template-columns:1fr}}
</style></head><body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><defs>
<symbol id="overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></symbol>
<symbol id="tasks" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h6"/></symbol>
<symbol id="tools" viewBox="0 0 24 24"><path d="m4 6 6 6-6 6M13 18h7"/></symbol>
<symbol id="files" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v11H3z"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 5 3 2 1 4 5 3 2-3 4-1 3-5-3-2-1-4-5-3z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L20 5"/></symbol>
</defs></svg>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">W</span>Workbench</div><div class="workspace"><small>当前项目空间</small><b>个人 AI 制作工作室</b><span style="float:right">⌄</span></div><div class="navlabel">WORKSPACE</div><nav class="nav" aria-label="主导航">
<button data-page="overview" class="active"><svg><use href="#overview"/></svg>工作总览</button><button data-page="employees"><svg><use href="#users"/></svg>AI员工<span class="count">6</span></button><button data-page="tasks"><svg><use href="#tasks"/></svg>任务中心<span class="count">5</span></button><button data-page="tools"><svg><use href="#tools"/></svg>工具中心</button><button data-page="assets"><svg><use href="#files"/></svg>产物中心</button></nav><div class="sidefoot"><nav class="nav"><button id="settings"><svg><use href="#settings"/></svg>工作台设置</button></nav><div class="profile"><div class="avatar">O</div><div>Ocean<small>个人工作空间</small></div></div></div></aside>
<div class="body"><header class="topbar"><div class="crumb">项目空间 <span style="margin:0 10px">/</span> <strong id="crumb">工作总览</strong></div><div class="bar-actions"><label class="search"><svg><use href="#search"/></svg><input id="page-search" aria-label="搜索当前页面" placeholder="搜索任务、员工、工具"></label><span class="demo">演示数据 · 未连接服务</span><button class="btn primary" id="new-task"><svg><use href="#plus"/></svg>新建任务</button></div></header><main class="main" id="main"></main></div></div>
<div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><form id="form"><h2 id="modal-title"></h2><p id="modal-sub"></p><div id="fields"></div><div class="modalfoot"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">保存演示记录</button></div></form></section></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='overview',dept='全部',filter='全部',selected=1,detailTab='概览';
const departments=['视频部','音频音乐部','开发部','设计部'];
const employees=[{name:'视频导演',role:'方案规划与分镜设计',dept:'视频部',tool:'通用 CLI',state:'待配置',icon:'play'},{name:'视频生成员',role:'工作流执行与候选素材回收',dept:'视频部',tool:'ComfyUI',state:'待接入',icon:'play'},{name:'开发工程师',role:'代码实现与工程维护',dept:'开发部',tool:'Codex CLI',state:'待业务验证',icon:'tools'},{name:'测试工程师',role:'用例验证与问题复现',dept:'开发部',tool:'通用 CLI',state:'待配置',icon:'check'},{name:'声音制作员',role:'配音剪辑与声音检查',dept:'音频音乐部',tool:'FFmpeg',state:'待配置',icon:'tasks'},{name:'视觉设计师',role:'设计方案与视觉素材',dept:'设计部',tool:'通用 CLI',state:'待配置',icon:'overview'}];
const tasks=[{id:1,title:'铁路宣传片 · 制作方案',employee:'视频导演',dept:'视频部',status:'待验收',kind:'review',time:'10:32',goal:'整理30秒宣传片的制作方案、素材需求与验收清单。'}, {id:2,title:'工作台 · 命令执行模块',employee:'开发工程师',dept:'开发部',status:'执行中',kind:'running',time:'10:18',goal:'实现独立参数传入与实时日志展示。'}, {id:3,title:'宣传片 · 旁白声音整理',employee:'声音制作员',dept:'音频音乐部',status:'排队',kind:'queued',time:'10:06',goal:'检查旁白素材并整理交接说明。'}, {id:4,title:'工作台 · 界面设计规范',employee:'视觉设计师',dept:'设计部',status:'已完成',kind:'done',time:'09:41',goal:'完成工作台主要页面的设计规范。'}, {id:5,title:'宣传片 · 视频候选生成',employee:'视频生成员',dept:'视频部',status:'草稿',kind:'queued',time:'09:20',goal:'远程服务接入后再提交工作流。'}];
const tools=[{name:'Codex CLI',type:'本地 CLI',path:'/usr/local/bin/codex',state:'待业务验证',kind:'queued'}, {name:'FFmpeg',type:'本地 CLI',path:'/usr/local/bin/ffmpeg',state:'待配置',kind:'queued'},{name:'ComfyUI',type:'远程 API',path:'尚未设置服务地址',state:'待接入',kind:'queued'}];
const assets=[['制作方案.md','TXT','视频导演','18 KB','待验收'],['界面规范.fig','FIG','视觉设计师','2.4 MB','已完成'],['配音素材清单.csv','CSV','声音制作员','6 KB','待验收']];
const main=document.getElementById('main');const badge=(s,k)=>`<span class="badge ${k}">${esc(s)}</span>`;
const head=(title,desc,action='')=>`<div class="pagehead"><div><div class="eyebrow">YOUR AI WORKSPACE</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;
function rows(list){return list.map(t=>`<tr class="task-row" data-task="${t.id}" tabindex="0" role="button" aria-label="查看${esc(t.title)}"><td><span class="task-title">${esc(t.title)}</span><span class="sub">TASK-${String(t.id).padStart(3,'0')} · ${t.dept}</span></td><td>${esc(t.employee)}</td><td>${badge(t.status,t.kind)}</td><td class="sub">${t.time}</td></tr>`).join('')}
const table=list=>`<table><thead><tr><th>任务</th><th>负责人</th><th>状态</th><th>更新</th></tr></thead><tbody>${rows(list)}</tbody></table>`;
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent={overview:'工作总览',employees:'AI员工',tasks:'任务中心',tools:'工具中心',assets:'产物中心'}[page];const query=document.getElementById('page-search').value.trim();let list=tasks.filter(t=>!query||t.title.includes(query)||t.employee.includes(query));
if(page==='overview'){main.innerHTML=head('工作总览','掌握任务进展，让每一步工作都有明确的负责人。',`<span class="sub">2026年10月2日 · 星期五</span>`)+`<section class="stats">${[[tasks.filter(t=>t.status==='执行中').length,'执行中','任务正在处理','play'],[tasks.filter(t=>t.status==='待验收').length,'待验收','等待你的确认','tasks'],[tasks.filter(t=>t.status==='已完成').length,'已完成','已通过人工验收','check'],[employees.length,'AI员工','覆盖4个工作部门','users']].map(([n,l,d,i])=>`<div class="stat"><div><label>${l}</label><b>${n}</b><small>${d}</small></div><span class="stat-icon">${icon(i)}</span></div>`).join('')}</section><div class="grid"><div><section class="panel"><div class="panelhead"><h2>当前任务</h2><button class="link" data-go="tasks">查看全部 →</button></div>${table(list.slice(0,4))}</section><div class="deptgrid">${departments.map((d,i)=>`<button class="dept" data-dept="${d}"><div class="depttop"><h3>${d}</h3><span style="color:#6581b8">${icon(['play','tasks','tools','overview'][i])}</span></div><p>${['方案、分镜、生成与剪辑','配音、音乐与声音整理','实现、验证与工程维护','界面、视觉与演示材料'][i]}</p><small>${employees.filter(e=>e.dept===d).length}位员工 · ${tasks.filter(t=>t.dept===d).length}项任务 <span style="float:right">进入部门 →</span></small></button>`).join('')}</div></div><aside><section class="panel"><div class="panelhead"><h2>工作交接</h2><span class="sub">演示</span></div><div class="flow">${[['01','方案已进入待验收','视频导演 → 你','10:32'],['02','界面规范已验收','视觉设计师 → 开发工程师','09:41'],['03','声音整理任务已排队','你 → 声音制作员','09:12']].map(([n,t,d,tm])=>`<div class="flowitem"><div class="flowdot">${n}</div><div><strong>${t}</strong><p>${d}<br>${tm}</p></div></div>`).join('')}</div></section><div class="connection"><h3>从一个工具开始</h3><p>绑定你常用的 CLI，再把任务分配给对应员工。</p><button class="btn" data-go="tools">管理工具 →</button></div></aside></div>`}
if(page==='employees'){main.innerHTML=head('AI员工','按职责与部门组织工作，工具能力由你配置。',`<button class="btn primary" data-modal="employee">${icon('plus')}新增员工</button>`)+`<div class="toolbar">${['全部',...departments].map(d=>`<button class="tab ${d===dept?'active':''}" data-filter-dept="${d}">${d}</button>`).join('')}</div><div class="cards">${employees.filter(e=>(dept==='全部'||e.dept===dept)&&(!query||e.name.includes(query))).map(e=>`<article class="employee"><div class="employee-head"><span class="roleicon">${icon(e.icon)}</span><div><h3>${esc(e.name)}</h3><p>${e.dept}</p></div></div><p>${esc(e.role)}</p><footer><span>${esc(e.tool)}</span>${badge(e.state,'queued')}</footer></article>`).join('')}</div>`}
if(page==='tasks'){list=list.filter(t=>filter==='全部'||t.status===filter);let t=tasks.find(t=>t.id===selected)||tasks[0];main.innerHTML=head('任务中心','从提交到验收，保留每一次执行的来龙去脉。')+`<div class="toolbar">${['全部','执行中','待验收','已完成','排队'].map(f=>`<button class="tab ${filter===f?'active':''}" data-status="${f}">${f}</button>`).join('')}</div><div class="tasklayout"><section class="panel">${table(list)}</section><aside class="panel detail">${badge(t.status,t.kind)}<h2>${esc(t.title)}</h2><div class="detail-tabs">${['概览','日志','产物','交接'].map(x=>`<button class="${x===detailTab?'active':''}" data-detail="${x}">${x}</button>`).join('')}</div>${detailTab==='概览'?`<p>${esc(t.goal)}</p><dl><dt>负责人</dt><dd>${esc(t.employee)}</dd><dt>所属部门</dt><dd>${t.dept}</dd><dt>项目</dt><dd>个人 AI 制作工作室</dd><dt>工作目录</dt><dd>~/Projects/demo</dd><dt>验收标准</dt><dd>交付内容完整，人工检查通过</dd></dl>`:detailTab==='日志'?`<pre>[演示日志，未真实执行]\n10:18 [stdout] 接收任务输入\n10:18 [stdout] 检查工作目录\n10:19 [stdout] 处理任务…\n10:32 [stdout] 输出已生成\n10:32 [system] 等待人工验收</pre>`:detailTab==='产物'?`<p>制作方案.md</p><p class="sub">演示文件引用 · 18 KB</p>`:`<p>交接包含任务目标、文件引用、参数与待确认事项。由用户确认后发起。</p><button class="btn" style="margin-top:15px" data-toast="演示交接：请在正式版本中选择目标员工和真实文件。">准备交接</button>`}<div class="detail-actions">${t.status==='待验收'?`<button class="btn primary" data-accept="${t.id}">${icon('check')}验收通过</button><button class="btn" data-toast="演示返工：正式版本会保留旧结果并创建新一次执行。">返工</button>`:t.status==='执行中'?`<button class="btn danger" data-stop="${t.id}">停止演示任务</button>`:`<button class="btn" data-toast="演示记录；未连接真实执行器。">查看执行记录</button>`}</div></aside></div>`}
if(page==='tools'){main.innerHTML=head('工具中心','统一配置接入方式，让员工使用合适的工具。',`<button class="btn primary" data-modal="tool">${icon('plus')}添加CLI工具</button>`)+`<section class="panel"><table><thead><tr><th>工具</th><th>类型</th><th>可执行路径或服务</th><th>接入状态</th><th>操作</th></tr></thead><tbody>${tools.filter(t=>!query||t.name.includes(query)).map(t=>`<tr><td><div class="toolname"><span class="toolicon">${icon('tools')}</span><strong>${esc(t.name)}</strong></div></td><td>${t.type}</td><td class="path">${esc(t.path)}</td><td>${badge(t.state,t.kind)}</td><td><button class="link" data-toast="界面演示，不运行版本检测。正式版本需在本机主动检测。">检测</button></td></tr>`).join('')}</tbody></table></section><p class="footnote">路径仅为设计示例。可执行、登录成功与业务验收分别记录。</p>`}
if(page==='assets'){main.innerHTML=head('产物中心','按来源任务整理结果，让交接有可追溯的文件。')+`<div class="toolbar"><button class="tab active">全部文件</button><span class="sub">3项演示产物</span></div><section class="panel"><table><thead><tr><th>文件</th><th>来源员工</th><th>大小</th><th>验收</th><th>操作</th></tr></thead><tbody>${assets.filter(a=>!query||a[0].includes(query)).map(a=>`<tr><td><div class="toolname"><span class="filetype">${a[1]}</span><strong>${a[0]}</strong></div></td><td>${a[2]}</td><td>${a[3]}</td><td>${badge(a[4],a[4]==='已完成'?'done':'review')}</td><td><button class="link" data-toast="演示文件，不存在实际文件路径。">预览</button></td></tr>`).join('')}</tbody></table></section><p class="footnote">演示内容不包含真实生成文件，文件预览与交接在正式客户端中接入。</p>`}
bind()}
function go(p){page=p;document.getElementById('page-search').value='';render()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3500)}
function bind(){main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));main.querySelectorAll('[data-task]').forEach(b=>{b.onclick=()=>{selected=Number(b.dataset.task);detailTab='概览';go('tasks')};b.onkeydown=e=>{if(e.key==='Enter')b.click()}});main.querySelectorAll('[data-dept]').forEach(b=>b.onclick=()=>{dept=b.dataset.dept;go('employees')});main.querySelectorAll('[data-filter-dept]').forEach(b=>b.onclick=()=>{dept=b.dataset.filterDept;render()});main.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{filter=b.dataset.status;render()});main.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detail;render()});main.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));main.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{let t=tasks.find(t=>t.id===Number(b.dataset.accept));t.status='已完成';t.kind='done';render();toast('演示任务已通过验收')});main.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{let t=tasks.find(t=>t.id===Number(b.dataset.stop));t.status='已取消';t.kind='queued';render();toast('已停止演示任务；无真实进程被操作')});main.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>modal(b.dataset.modal))}
let modalType='task',lastFocus=null;const overlay=document.getElementById('overlay');
const field=(name,label,markup,help='')=>`<div class="formrow"><label for="${name}">${label}</label>${markup}${help?`<small>${help}</small>`:''}</div>`;
function modal(type){modalType=type;lastFocus=document.activeElement;document.getElementById('form').reset();document.getElementById('modal-title').textContent={task:'新建任务',tool:'添加CLI工具',employee:'新增AI员工'}[type];document.getElementById('modal-sub').textContent='本页面仅保存演示记录，不会执行命令。';let fields=field('name',type==='task'?'任务标题':type==='tool'?'工具名称':'员工名称','<input id="name" name="name" required maxlength="80" placeholder="填写名称">');if(type==='task')fields+=field('owner','负责人',`<select id="owner" name="owner">${employees.map(e=>`<option>${esc(e.name)}</option>`).join('')}</select>`)+field('input','任务目标','<textarea id="input" name="input" rows="4" required placeholder="说明需要完成什么，以及如何验收"></textarea>');if(type==='tool')fields+=field('path','可执行文件绝对路径','<input id="path" name="path" required placeholder="/usr/local/bin/your-tool">')+field('args','参数列表','<textarea id="args" name="args" rows="4" placeholder="每行一个参数"></textarea>','{input}作为完整输入传入；不进行shell展开。');if(type==='employee')fields+=field('department','所属部门',`<select id="department" name="department">${departments.map(d=>`<option>${d}</option>`).join('')}</select>`)+field('tool','绑定工具',`<select id="tool" name="tool">${tools.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select>`)+field('role','职责说明','<textarea id="role" name="role" rows="3" required placeholder="明确这位员工负责什么"></textarea>');document.getElementById('fields').innerHTML=fields;overlay.hidden=false;document.getElementById('name').focus()}
function closeModal(){overlay.hidden=true;if(lastFocus?.isConnected)lastFocus.focus()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(modalType==='task'){const owner=employees.find(x=>x.name===f.get('owner'));tasks.unshift({id:Math.max(...tasks.map(t=>t.id))+1,title:f.get('name'),employee:owner.name,dept:owner.dept,status:'草稿',kind:'queued',time:'刚刚',goal:f.get('input')});page='tasks'}if(modalType==='tool'){const path=f.get('path');if(!path.startsWith('/')){document.getElementById('path').setCustomValidity('请输入绝对路径');document.getElementById('path').reportValidity();return}tools.push({name:f.get('name'),type:'本地 CLI',path,state:'待配置',kind:'queued'});page='tools'}if(modalType==='employee'){employees.push({name:f.get('name'),role:f.get('role'),dept:f.get('department'),tool:f.get('tool'),state:'待配置',icon:'users'});dept='全部';page='employees'}closeModal();render();toast('演示记录已保存')};document.getElementById('cancel').onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal()};document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...overlay.querySelectorAll('input,select,textarea,button')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.getElementById('page-search').oninput=render;document.getElementById('new-task').onclick=()=>modal('task');document.getElementById('settings').onclick=()=>toast('设置方向：项目目录、默认并发和通知。正式版本按里程碑实现。');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
